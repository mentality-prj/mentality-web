name: Format corporate documentation once
on:
  push:
    branches:
      - docs/dzvin-corporate-language-reverse-audit-20261025
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/dzvin-corporate-language-reverse-audit-20261025
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Normalize only changed documentation TypeScript
        run: yarn prettier --write content/public-docs/decks.test.ts content/public-docs/decks.ts content/public-docs/funding-decks.ts content/public-docs/index.test.ts
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/dzvin-corporate-copy-format-once.yml
          git add content/public-docs/decks.test.ts content/public-docs/decks.ts content/public-docs/funding-decks.ts content/public-docs/index.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(docs): format revised corporate documentation"
            git push origin HEAD:docs/dzvin-corporate-language-reverse-audit-20261025
          fi
