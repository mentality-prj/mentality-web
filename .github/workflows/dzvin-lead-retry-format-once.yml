name: Dzvin Contact Retry One-Time Format
on:
  push:
    branches:
      - 'feat/dzvin-548-lead-operator-console-20261022'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'feat/dzvin-548-lead-operator-console-20261022'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install pinned Prettier
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile
      - name: Format only retry-aware lead forms and tests
        run: |
          ./node_modules/.bin/prettier --write \
            components/features/Business/BusinessLeadForm.tsx \
            components/features/Business/BusinessLeadForm.test.tsx \
            components/features/Research/ResearchPartnerForm.tsx \
            components/features/Research/ResearchPartnerForm.test.tsx
      - name: Commit only scoped formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- components/features/Business/BusinessLeadForm.tsx \
            components/features/Business/BusinessLeadForm.test.tsx \
            components/features/Research/ResearchPartnerForm.tsx \
            components/features/Research/ResearchPartnerForm.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(dzvin): format retry-bound contact forms'
            git push origin HEAD:refs/heads/feat/dzvin-548-lead-operator-console-20261022
          fi
