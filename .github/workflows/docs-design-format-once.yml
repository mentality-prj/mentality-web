name: One-time docs design formatting
on:
  push:
    branches:
      - fix/dzvin-docs-design-system-restore-20261025
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dzvin-docs-design-system-restore-20261025
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Apply repo formatting only
        run: yarn prettier --write 'app/[locale]/(public)/docs/page.tsx' 'app/[locale]/(public)/docs/[slug]/page.tsx' 'app/[locale]/(public)/docs/decks/[audience]/page.tsx' 'app/[locale]/(public)/docs/decks/DeckToolbar.tsx' 'app/[locale]/(public)/docs/docs-design.test.ts'
      - name: Commit formatting and self-delete workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/docs-design-format-once.yml
          git add 'app/[locale]/(public)/docs/page.tsx' 'app/[locale]/(public)/docs/[slug]/page.tsx' 'app/[locale]/(public)/docs/decks/[audience]/page.tsx' 'app/[locale]/(public)/docs/decks/DeckToolbar.tsx' 'app/[locale]/(public)/docs/docs-design.test.ts'
          if ! git diff --cached --quiet; then
            git commit -m "style(docs): align layout fix with repository formatting"
            git push origin HEAD:fix/dzvin-docs-design-system-restore-20261025
          fi
