name: Gate3 temporary format branch
on:
  push:
    branches: [feat/dzvin-gate3-nest-dip-admin-client-20261015]
    paths:
      - .github/workflows/gate3-temp-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'mentality-prj/mentality-web' && github.ref == 'refs/heads/feat/dzvin-gate3-nest-dip-admin-client-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dzvin-gate3-nest-dip-admin-client-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Format Gate 3 files
        run: |
          yarn prettier --write requests/dipClient.ts requests/dipClient.test.ts 'app/[locale]/admin/dip/system/actions.ts' components/features/Dip/SystemView.tsx components/features/Dip/DipConnectionBanner.tsx 'app/[locale]/admin/dip/system/page.tsx' 'app/[locale]/admin/dip/data/page.tsx' 'app/[locale]/admin/dip/models/page.tsx' 'app/[locale]/admin/dip/research/page.tsx' 'app/[locale]/admin/dip/decisions/page.tsx' scripts/api-boundary.test.mjs messages/en/pages/Dip.json messages/uk/pages/Dip.json messages/pl/pages/Dip.json DOCS/unified-api.md
          yarn eslint --fix requests/dipClient.ts requests/dipClient.test.ts 'app/[locale]/admin/dip/system/actions.ts' components/features/Dip/SystemView.tsx components/features/Dip/DipConnectionBanner.tsx 'app/[locale]/admin/dip/system/page.tsx' 'app/[locale]/admin/dip/data/page.tsx' 'app/[locale]/admin/dip/models/page.tsx' 'app/[locale]/admin/dip/research/page.tsx' 'app/[locale]/admin/dip/decisions/page.tsx' scripts/api-boundary.test.mjs
      - name: Commit bounded style fixes
        run: |
          if ! git diff --quiet -- requests/dipClient.ts requests/dipClient.test.ts 'app/[locale]/admin/dip/system/actions.ts' components/features/Dip/SystemView.tsx components/features/Dip/DipConnectionBanner.tsx 'app/[locale]/admin/dip/system/page.tsx' 'app/[locale]/admin/dip/data/page.tsx' 'app/[locale]/admin/dip/models/page.tsx' 'app/[locale]/admin/dip/research/page.tsx' 'app/[locale]/admin/dip/decisions/page.tsx' scripts/api-boundary.test.mjs messages/en/pages/Dip.json messages/uk/pages/Dip.json messages/pl/pages/Dip.json DOCS/unified-api.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+TarasGez@users.noreply.github.com'
            git add requests/dipClient.ts requests/dipClient.test.ts 'app/[locale]/admin/dip/system/actions.ts' components/features/Dip/SystemView.tsx components/features/Dip/DipConnectionBanner.tsx 'app/[locale]/admin/dip/system/page.tsx' 'app/[locale]/admin/dip/data/page.tsx' 'app/[locale]/admin/dip/models/page.tsx' 'app/[locale]/admin/dip/research/page.tsx' 'app/[locale]/admin/dip/decisions/page.tsx' scripts/api-boundary.test.mjs messages/en/pages/Dip.json messages/uk/pages/Dip.json messages/pl/pages/Dip.json DOCS/unified-api.md
            git commit -m 'fix(style): normalize Gate 3 source files'
            git push origin HEAD:feat/dzvin-gate3-nest-dip-admin-client-20261015
          fi
