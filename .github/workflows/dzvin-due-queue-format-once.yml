name: Dzvin Due Queue One-Time Format
on:
  push:
    branches:
      - feat/dzvin-548-lead-operator-console-20261022
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dzvin-548-lead-operator-console-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install locked dependencies
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile
      - name: Format only the two due-queue files
        run: |
          ./node_modules/.bin/prettier --write \
            'components/features/LeadPipeline/LeadOperatorConsole.test.tsx' \
            'lib/backend/path.ts'
      - name: Push formatter-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'components/features/LeadPipeline/LeadOperatorConsole.test.tsx' 'lib/backend/path.ts'
          if ! git diff --cached --quiet; then
            git commit -m 'style(dzvin): format due queue test and BFF path'
            git push origin HEAD:refs/heads/feat/dzvin-548-lead-operator-console-20261022
          fi
