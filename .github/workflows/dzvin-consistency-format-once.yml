name: One-time grant presentation formatting
on:
  push:
    branches:
      - docs/dzvin-final-corporate-consistency-20261025
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/dzvin-final-corporate-consistency-20261025
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Format funding slide copy
        run: yarn prettier --write content/public-docs/funding-decks.ts
      - name: Commit formatting and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/dzvin-consistency-format-once.yml
          git add content/public-docs/funding-decks.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(docs): format corrected grant presentations"
            git push origin HEAD:docs/dzvin-final-corporate-consistency-20261025
          fi
