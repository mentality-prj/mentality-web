name: Format investor copy once
on:
  push:
    branches: [fix/dzvin-investor-funding-copy-20261025]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dzvin-investor-funding-copy-20261025
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Fix targeted text formatting
        run: yarn prettier --write content/public-docs/funding-decks.ts content/public-docs/index.test.ts
      - name: Commit formatting and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/dzvin-investor-copy-format-once.yml
          git add content/public-docs/funding-decks.ts content/public-docs/index.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(docs): normalize investor copy test and presentation"
            git push origin HEAD:fix/dzvin-investor-funding-copy-20261025
          fi
