name: Frontend Run Checks

on:
  pull_request:
    branches:
      - dev
      - production

jobs:
  check-file-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'components/**'
              - 'features/**'
              - 'DOCS/**'
              - 'context/**'
              - 'hooks/**'
              - 'requests/**'
              - 'helpers/**'
              - 'lib/**'
              - 'types/**'
              - 'constants/**'
              - 'mappers/**'
              - 'i18n/**'
              - 'messages/**'
              - 'ds/**'
              - 'ui/**'
              - 'config/**'
              - 'public/**'
              - 'styles/**'
              - 'utils/**'
              - 'actions/**'
              - 'scripts/**'
              - 'proxy.ts'
              - 'eslint.config.mjs'
              - 'package.json'
              - 'yarn.lock'
              - 'tsconfig.json'
              - 'next.config.*'
              - 'jest.config.*'
              - 'jest.setup.*'
              - '.eslintrc.json'
              - '.prettierrc'
              - '.github/workflows/run-checks.yml'

  unified-api-autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/unified-app-api'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile
      - name: Format only unified API patch
        run: |
          ./node_modules/.bin/eslint --fix scripts/api-boundary.test.mjs
          ./node_modules/.bin/prettier --write scripts/api-boundary.test.mjs DOCS/unified-api.md             "app/api/backend/[...path]/route.ts" "app/api/backend/[...path]/route.test.ts"             lib/backend/path.ts requests/contact.ts requests/auth.ts requests/auth.test.ts             helpers/api-wrapper.ts helpers/api-wrapper.test.ts             hooks/useGroups.ts hooks/useInvites.ts             components/features/MyProgress/PersonalGoals/DeadlineCountdown.tsx
      - name: Commit canonical formatting
        env:
          HUSKY: '0'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(api): canonical lint and Prettier formatting'
          git push origin HEAD:refs/heads/refactor/unified-app-api

  linters:
    needs: [check-file-changes, unified-api-autofix]
    if: needs.check-file-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile
      - name: Generate Next route types
        run: yarn next typegen
      - name: TypeScript
        run: yarn types
      - name: ESLint
        run: yarn lint
      - name: Prettier
        run: yarn prettier
      - name: Unit tests
        run: yarn test --runInBand --watch=false
      - name: Unified API transport policy
        run: node --test scripts/api-boundary.test.mjs
      - name: Smoke harness tests
        run: node --test scripts/e2e-smoke.test.mjs
      - name: Next production build
        run: yarn build
