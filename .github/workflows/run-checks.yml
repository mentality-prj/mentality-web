name: Frontend Run Checks

on:
  pull_request:
    branches:
      - dev
      - production
      - 'release/**'

jobs:
  check-file-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'components/**'
              - 'features/**'
              - 'DOCS/**'
              - 'context/**'
              - 'hooks/**'
              - 'requests/**'
              - 'helpers/**'
              - 'lib/**'
              - 'types/**'
              - 'constants/**'
              - 'mappers/**'
              - 'i18n/**'
              - 'messages/**'
              - 'ds/**'
              - 'ui/**'
              - 'config/**'
              - 'public/**'
              - 'styles/**'
              - 'utils/**'
              - 'actions/**'
              - 'scripts/**'
              - 'proxy.ts'
              - 'eslint.config.mjs'
              - 'package.json'
              - 'yarn.lock'
              - 'tsconfig.json'
              - 'next.config.*'
              - 'jest.config.*'
              - 'jest.setup.*'
              - '.eslintrc.json'
              - '.prettierrc'
              - '.github/workflows/run-checks.yml'

  linters:
    needs: check-file-changes
    if: needs.check-file-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile
      - name: Generate Next route types
        run: yarn next typegen
      - name: TypeScript
        run: yarn types
      - name: ESLint
        run: yarn lint
      - name: Prettier
        run: yarn prettier
      - name: Unit tests
        run: yarn test --runInBand --watch=false
      - name: Unified API transport policy
        run: node --test scripts/api-boundary.test.mjs
      - name: Smoke harness tests
        run: node --test scripts/e2e-smoke.test.mjs
      - name: Next production build
        run: yarn build

  release-build:
    needs: check-file-changes
    if: needs.check-file-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install locked dependencies
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile
      - name: Generate Next.js route types
        run: yarn next typegen
      - name: Independently compile the production app
        run: yarn build
