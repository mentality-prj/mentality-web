name: Frontend Run Checks

on:
  pull_request:
    branches:
      - dev
      - production

jobs:
  check-file-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'components/**'
              - 'context/**'
              - 'hooks/**'
              - 'requests/**'
              - 'helpers/**'
              - 'lib/**'
              - 'types/**'
              - 'constants/**'
              - 'mappers/**'
              - 'i18n/**'
              - 'messages/**'
              - 'ds/**'
              - 'ui/**'
              - 'config/**'
              - 'public/**'
              - 'styles/**'
              - 'utils/**'
              - 'actions/**'
              - 'scripts/**'
              - 'package.json'
              - 'yarn.lock'
              - 'tsconfig.json'
              - 'next.config.*'
              - 'jest.config.*'
              - 'jest.setup.*'
              - '.eslintrc.json'
              - '.prettierrc'
              - '.github/workflows/run-checks.yml'

  migration-style-sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/frontend-p0-p2-architecture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile
      - name: Apply canonical ESLint and Prettier autofixes
        run: |
          yarn fix || true
          yarn format
      - name: Commit style-only changes
        env:
          HUSKY: '0'
        run: |
          if git diff --quiet; then
            echo 'No formatting changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(next16): apply ESLint and Prettier autofixes'
          git push origin HEAD:refs/heads/refactor/frontend-p0-p2-architecture

  linters:
    needs: [check-file-changes, migration-style-sync]
    if: needs.check-file-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile
      - name: Generate Next route types
        run: yarn next typegen
      - name: TypeScript
        run: yarn types
      - name: ESLint
        run: yarn lint
      - name: Prettier
        run: yarn prettier
      - name: Unit tests
        run: yarn test --runInBand --watch=false
      - name: Smoke harness tests
        run: node --test scripts/e2e-smoke.test.mjs
      - name: Next production build
        run: yarn build
